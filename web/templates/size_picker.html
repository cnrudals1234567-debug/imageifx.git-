{# groups: [(키, 이름, [(프리셋키, 프리셋)])]. 업로드와 '사이즈 추가'에서 같이 쓴다. #}
{% for g, label, items in groups %}{% if items %}
<fieldset class="grp"><legend>{{ label }}</legend>
<label class="chk allbox"><input type="checkbox" onclick="for(var c of this.closest('fieldset').querySelectorAll('input[name=presets]'))c.checked=this.checked">전체 선택</label>
<div class="sizes">{% for k, v in items %}
<label class="size"><input type="checkbox" name="presets" value="{{k}}" {% if k==default %}checked{% endif %}>
<b>{{v.label}}</b> <span class="mut">{{v.size[0]}}×{{v.size[1]}}</span><br>
<span class="mut">{{v.use}} · 용량 {{ '%d KB'|format(v.max_kb) if v.max_kb else '-' }} 이하</span><br>
<span class="badge {{ 'ok' if v.grade in ('A',) else ('warn' if 'C' in v.grade else '') }}" title="{{v.note}}">규칙 신뢰도 {{v.grade}}{% if not v.verified %} · 공식 미확인{% endif %}</span>
</label>{% endfor %}</div></fieldset>
{% endif %}{% endfor %}
