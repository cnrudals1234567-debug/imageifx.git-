{% extends "base.html" %}{% block title %}{{ pinfo.label }} · {{ job.id }}{% endblock %}{% block body %}
<p class="mut"><a href="/jobs/{{job.id}}">← 작업 {{job.id}}</a></p>
<h1>{{ pinfo.label }} <span class="mut">{{ pinfo.size[0] }}×{{ pinfo.size[1] }} · {{ pinfo.use }}</span></h1>
<div id="body">{% include "size_body.html" %}</div>
<script>
var url='/jobs/{{ job.id }}/size/{{ preset }}/fragment';
function tick(){
  fetch(url).then(function(r){return r.text();}).then(function(h){
    document.getElementById('body').innerHTML=h;
    if(document.querySelector('[data-active]'))setTimeout(tick,3000);
  }).catch(function(){setTimeout(tick,5000);});
}
if(document.querySelector('[data-active]'))setTimeout(tick,3000);
</script>{% endblock %}
