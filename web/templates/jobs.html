{% extends "base.html" %}{% block body %}<h1>작업 목록</h1><div class="card"><table>
<tr><th>작업</th><th>파일</th><th>상태</th><th>사이즈</th><th class="r">토큰</th></tr>
{% for j in jobs %}<tr><td><a href="/jobs/{{j.id}}">{{j.id}}</a></td><td>{{j.filename}}</td><td>{{j.status}}</td><td>{{j.presets|join(', ')}}</td><td class="r">{{ sum_usage(j.usage).total|n }}</td></tr>{% else %}<tr><td colspan="5" class="mut">작업이 없습니다</td></tr>{% endfor %}</table></div>{% endblock %}
