{% extends "base.html" %}{% block title %}작업 {{job.id}}{% endblock %}{% block body %}
<h1>작업 {{job.id}} <span class="mut">{{job.filename}}</span></h1>
<div id="body">{% include "job_body.html" %}</div>
<script>
var jid={{ job.id|tojson }};
function tick(){
  fetch('/jobs/'+jid+'/fragment').then(function(r){return r.text();}).then(function(h){
    document.getElementById('body').innerHTML=h;
    if(document.querySelector('[data-active]'))setTimeout(tick,3000);
  }).catch(function(){setTimeout(tick,5000);});
}
if(document.querySelector('[data-active]'))setTimeout(tick,3000);
</script>{% endblock %}
