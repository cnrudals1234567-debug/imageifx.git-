[project]
name = "imageifx"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "easyocr>=1.7.2",
    "numpy>=2.5.4",
    "onnxruntime>=1.31.0",
    "opencv-python-headless>=5.0.0.93",
    "pillow>=12.3.0",
    "rembg>=2.0.85",
    "simple-lama-inpainting>=0.1.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
